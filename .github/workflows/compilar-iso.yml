name: Compilar ISO

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'herramientas/**'

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af || true
          df -h /

      - name: Compilar la ISO
        run: sudo ./build.sh

      - name: Resumen
        if: always()
        run: |
          ls -lh salida/ || true
          echo "----- avisos -----"
          cat salida/avisos.txt || true
          df -h /

      - name: Guardar la ISO
        uses: actions/upload-artifact@v4
        with:
          name: brisa-iso
          path: |
            salida/*.iso
            salida/*.sha256
            salida/avisos.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
