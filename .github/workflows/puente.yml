name: Puente - compilar Linux, Windows y Android

on:
  push:
    branches: [puente]
    paths-ignore:
      - "servidor/**"
      - "PUENTE-LEEME.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "puente-ultima"
